[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telespec"
version = "0.1.0"
description = "Explainable spectral analysis and anomaly detection for irregular network telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Akshaj Bachu" }]
maintainers = [{ name = "Akshaj Bachu" }]
keywords = ["telemetry", "spectral-analysis", "anomaly-detection", "lomb-scargle", "networking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
data = ["requests>=2.32"]
ui = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.12"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
  "telespec[data,ui,docs]",
  "build>=1.2",
  "hatchling>=1.27",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
telespec = "telespec.cli:app"

[project.urls]
Homepage = "https://github.com/akshajbachu/telespec"
Documentation = "https://akshajbachu.github.io/telespec"
Source = "https://github.com/akshajbachu/telespec"
Issues = "https://github.com/akshajbachu/telespec/issues"
Changelog = "https://github.com/akshajbachu/telespec/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/telespec"]
artifacts = ["src/telespec/server/static/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
packages = ["telespec"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=telespec --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = ["integration: exercises multiple layers", "network: downloads public data"]

[tool.coverage.run]
branch = true
source = ["telespec"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
